[package]
name = "omanod"
description = "An Omarchy-native personal agent, written in Rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "omanod"
path = "src/main.rs"

[dependencies]
omanod-core = { path = "../crates/omanod-core" }
serde_json = "1"
slint = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
slint-build = "1"
