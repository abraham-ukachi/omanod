[workspace]
resolver = "2"
members = ["crates/omanod-core", "app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Abraham Ukachi <abrahamukachi@gmail.com>"]
license = "MIT"
repository = "https://github.com/abraham-ukachi/omanod"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
